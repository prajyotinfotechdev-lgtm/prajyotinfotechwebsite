<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e2756" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no,address=no,email=no" />

    <title>Prajyot Infotech | Premium Websites & Apps</title>

    <!-- Canonical -->
    <link rel="canonical" href="https://prajyotinfotech.com/" />

    <!-- Basic SEO -->
    <meta
      name="description"
      content="Prajyot Infotech builds premium, fast websites and apps with modern design and exceptional user experience. From landing pages to full-stack products."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prajyot Infotech" />
    <meta property="og:title" content="Prajyot Infotech | Premium Websites & Apps" />
    <meta
      property="og:description"
      content="Prajyot Infotech builds premium, fast websites and apps with modern design and exceptional user experience."
    />
    <meta property="og:url" content="https://prajyotinfotech.com/" />
    <meta property="og:image" content="https://prajyotinfotech.com/og/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prajyot Infotech | Premium Websites & Apps" />
    <meta
      name="twitter:description"
      content="Prajyot Infotech builds premium, fast websites and apps with modern design and exceptional user experience."
    />
    <meta name="twitter:image" content="https://prajyotinfotech.com/og/og-default.jpg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Prajyot Infotech",
        "url": "https://prajyotinfotech.com",
        "logo": "https://prajyotinfotech.com/videos/Logo.jpg",
        "sameAs": ["https://www.linkedin.com/company/prajyotinfotech"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Prajyot Infotech",
        "url": "https://prajyotinfotech.com"
      }
    </script>

    <!-- App icons / PWA hooks -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preloads (avoid unsupported `as="video"` warning) -->
    <link rel="preload" as="image" href="/images/company-profile-poster.jpg" />
  </head>

  <body class="bg-slate-50">
    <noscript>
      <div style="padding:12px;text-align:center;background:#fff3cd;color:#7a5b00">
        JavaScript is required for Prajyot Infotech to work properly.
      </div>
    </noscript>

    <!-- target for "Skip to content" link -->
    <div id="top"></div>

    <div id="root"></div>

    <!-- Keep at end of body for faster first paint -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
