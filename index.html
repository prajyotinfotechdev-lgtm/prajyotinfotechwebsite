<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e2756" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Prajyot Infotech</title>

    <!-- AI Discovery / AEO -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" />

    <!-- Structured Data: Organization / ProfessionalService -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "ProfessionalService", "LocalBusiness"],
        "@id": "https://prajyotinfotech.in/#organization",
        "name": "Prajyot Infotech",
        "alternateName": ["Prajyot", "Prajyot Infotech", "Prajyot Infotech Software", "Prajyot Infotech India", "Prajyot Technology", "Prajyot Infotech Software Company"],
        "url": "https://prajyotinfotech.in",

          "@type": "PostalAddress",
          "addressLocality": "Pune",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": "18.5204",
          "longitude": "73.8567"
        },
        "logo": {
          "@type": "ImageObject",
          "url": "https://prajyotinfotech.in/videos/Logo.jpg",
          "width": 200,
          "height": 200
        },
        "description": "Prajyot Infotech is a professional software and web development company in India specializing in custom websites, Android and iOS mobile apps, CRM systems, ERP solutions, inventory management software, billing software, business management systems, WhatsApp automation, and complete business digitalization solutions for small and medium businesses across India and globally.",
        "slogan": "Complete Digitalization Solutions for Your Business",
        "foundingDate": "2018",
        "areaServed": [
          { "@type": "Country", "name": "India" },
          { "@type": "State", "name": "Maharashtra" },
          { "@type": "City", "name": "Pune" },
          { "@type": "City", "name": "Mumbai" },
          { "@type": "City", "name": "Latur" },
          { "@type": "City", "name": "Nagpur" },
          { "@type": "City", "name": "Nashik" },
          { "@type": "City", "name": "Aurangabad" }
        ],
        "serviceType": [
          "Website Development",
          "E-Commerce Development",
          "Mobile App Development",
          "Custom Software Development",
          "CRM Development",
          "ERP Software Development",
          "Inventory Management Software",
          "Billing Software",
          "WhatsApp Automation",
          "Business Digitalization"
        ],
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "contactType": "sales",
            "telephone": "+917020708747",
            "email": "hr@prajyotinfotech.in",
            "areaServed": "IN",
            "availableLanguage": ["English", "Hindi", "Marathi"]
          },
          {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "telephone": "+917020708747",
            "email": "hr@prajyotinfotech.in",
            "areaServed": "IN",
            "availableLanguage": ["English", "Hindi", "Marathi"]
          }
        ],
        "sameAs": [
          "https://www.instagram.com/prajyot.infotech",
          "https://www.linkedin.com/company/prajyotinfotech"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://prajyotinfotech.in/#website",
        "name": "Prajyot Infotech",
        "url": "https://prajyotinfotech.in",
        "description": "Official website of Prajyot Infotech — Software & Web Development Company in India",
        "publisher": {
          "@id": "https://prajyotinfotech.in/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://prajyotinfotech.in/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- App icons / PWA hooks -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
